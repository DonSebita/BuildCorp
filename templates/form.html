{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="encabezado">
  <div>
    <h1>{{ titulo }}</h1>
    {% if ayuda %}<p>{{ ayuda }}</p>{% endif %}
  </div>
</div>
<form method="post" enctype="multipart/form-data" class="hoja" style="max-width:760px" novalidate>
  {% csrf_token %}
  <div class="hoja-cuerpo">
    {% include "includes/campos.html" %}
  </div>
  <div class="hoja-cabeza justify-content-end" style="border-top:1px solid var(--linea-suave);border-bottom:0">
    <a class="btn btn-outline-primary" href="javascript:history.back()">Cancelar</a>
    <button class="btn btn-primary" type="submit">Guardar</button>
  </div>
</form>
{% endblock %}
